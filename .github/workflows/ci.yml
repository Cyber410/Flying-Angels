name: CI

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development

jobs:
  frontend-check:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip if frontend project does not exist
        if: ${{ hashFiles('frontend/package.json') == '' }}
        run: |
          echo "Frontend project not found, skipping frontend checks."

      - name: Set up Node.js
        if: ${{ hashFiles('frontend/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          #cache: npm
          #cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint code
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

      - name: Type check
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm run typecheck

      - name: Run unit tests
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build frontend
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm run build

  backend-check:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip if backend project does not exist
        if: ${{ hashFiles('backend/pom.xml') == '' }}
        run: |
          echo "Backend project not found, skipping backend checks."

      - name: Set up Java 17
        if: ${{ hashFiles('backend/pom.xml') != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          #cache: maven
          #cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        if: ${{ hashFiles('backend/pom.xml') != '' }}
        working-directory: backend
        run: |
          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw test
          else
            mvn test
          fi

      - name: Build backend
        if: ${{ hashFiles('backend/pom.xml') != '' }}
        working-directory: backend
        run: |
          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw package -DskipTests
          else
            mvn package -DskipTests
          fi
