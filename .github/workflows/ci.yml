name: CI

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development

jobs:
  frontend-check:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip if frontend project does not exist
        run: |
          if [ ! -f frontend/package.json ]; then
            echo "Frontend project not found, skipping frontend checks."
            exit 0
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint code
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Run unit tests
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend-check:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip if backend project does not exist
        run: |
          if [ ! -f backend/pom.xml ]; then
            echo "Backend project not found, skipping backend checks."
            exit 0
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        working-directory: backend
        run: |
          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw test
          else
            mvn test
          fi

      - name: Build backend
        working-directory: backend
        run: |
          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw package -DskipTests
          else
            mvn package -DskipTests
          fi
