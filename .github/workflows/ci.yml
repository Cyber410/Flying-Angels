name: CI

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development

jobs:
  frontend-check:
    name: Frontend checks
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/package.json') != '' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint code
        run: npm run lint -- --max-warnings=0

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build frontend
        run: npm run build

  backend-check:
    name: Backend checks
    runs-on: ubuntu-latest
    if: ${{ hashFiles('backend/pom.xml') != '' || hashFiles('backend/build.gradle') != '' || hashFiles('backend/build.gradle.kts') != '' || hashFiles('backend/settings.gradle') != '' }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run backend tests
        run: |
          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw test
          elif [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew test
          else
            echo "No Java build tool found in backend directory"
            exit 1
          fi

      - name: Build backend
        run: |
          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw package -DskipTests
          elif [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build -x test
          else
            echo "No Java build tool found in backend directory"
            exit 1
          fi
