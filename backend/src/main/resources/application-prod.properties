app.security.require-authentication=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
spring.jpa.show-sql=false
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# A deployed invitation must never send a localhost activation link.
app.auth.activation-url=${APP_ACTIVATION_URL:}
