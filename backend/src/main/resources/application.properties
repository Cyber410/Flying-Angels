spring.application.name=backend

spring.datasource.url=${DATABASE_URL:jdbc:mysql://mysql:3306/flying_angels?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
# Flyway owns schema changes; Hibernate checks that mappings match afterward.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.target=latest
spring.flyway.baseline-version=1
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.fail-on-missing-locations=true
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
# Client-address trust is handled explicitly by LoginClientAddress, never arbitrary forwarding headers.
server.forward-headers-strategy=none
app.security.require-authentication=${APP_REQUIRE_AUTHENTICATION:true}
app.security.login-throttle.enabled=${APP_LOGIN_THROTTLE_ENABLED:true}
app.security.login-throttle.account-max-failures=${APP_LOGIN_THROTTLE_ACCOUNT_LIMIT:5}
app.security.login-throttle.ip-max-failures=${APP_LOGIN_THROTTLE_IP_LIMIT:100}
app.security.login-throttle.window-seconds=${APP_LOGIN_THROTTLE_WINDOW_SECONDS:900}
app.security.login-throttle.block-seconds=${APP_LOGIN_THROTTLE_BLOCK_SECONDS:900}
app.security.login-throttle.trusted-proxies=${APP_LOGIN_TRUSTED_PROXIES:}
app.security.login-throttle.cleanup-enabled=${APP_LOGIN_THROTTLE_CLEANUP_ENABLED:true}
app.security.login-throttle.cleanup-interval-ms=${APP_LOGIN_THROTTLE_CLEANUP_MS:60000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.auth.bootstrap-email=${APP_ADMIN_EMAIL:${APP_ADMIN_USERNAME:}}
app.auth.bootstrap-password=${APP_ADMIN_PASSWORD:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.availability.time-zone=${APP_AVAILABILITY_TIME_ZONE:America/Toronto}
app.age-groups.bands=${APP_AGE_GROUP_BANDS:}
app.auth.activation-url=${APP_ACTIVATION_URL:http://localhost:5173/activate}
app.auth.invitation-hours=${APP_INVITATION_HOURS:48}
app.auth.mail-from=${SMTP_FROM:noreply@flyingangels.local}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.auth.mail-outbox.encryption-key=${APP_MAIL_OUTBOX_KEY:}
app.auth.mail-outbox.enabled=${APP_MAIL_OUTBOX_ENABLED:true}
app.auth.mail-outbox.poll-interval-ms=${APP_MAIL_OUTBOX_POLL_MS:5000}
app.auth.mail-outbox.batch-size=${APP_MAIL_OUTBOX_BATCH_SIZE:20}
app.auth.mail-outbox.max-attempts=${APP_MAIL_OUTBOX_MAX_ATTEMPTS:5}
app.auth.mail-outbox.retry-base-seconds=${APP_MAIL_OUTBOX_RETRY_BASE_SECONDS:60}
app.auth.mail-outbox.retry-max-seconds=${APP_MAIL_OUTBOX_RETRY_MAX_SECONDS:3600}
app.auth.mail-outbox.lease-seconds=${APP_MAIL_OUTBOX_LEASE_SECONDS:120}
