services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: flying_angels_ci
      MYSQL_ROOT_PASSWORD: ci-root-password
      MYSQL_USER: ci_user
      MYSQL_PASSWORD: ci-app-password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the built backend image}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/flying_angels_ci?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ci_user
      SPRING_DATASOURCE_PASSWORD: ci-app-password
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to the built frontend image}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CI_HTTP_PORT:-18080}:80"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8080"
