# Local disposable manual testing only. Layer over compose.ci.yml; never deploy this fixture.
services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:mysql://mysql:3306/flying_angels_ci?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: ci_user
      DATABASE_PASSWORD: ci-app-password
      APP_REQUIRE_AUTHENTICATION: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
      SPRING_FLYWAY_BASELINE_VERSION: ${SPRING_FLYWAY_BASELINE_VERSION:-1}
      APP_ADMIN_EMAIL: ${POSTMAN_ADMIN_EMAIL:?Set POSTMAN_ADMIN_EMAIL for the disposable test Admin}
      APP_ADMIN_PASSWORD: ${POSTMAN_ADMIN_PASSWORD:?Set POSTMAN_ADMIN_PASSWORD to at least 12 characters}
      # Loopback-only HTTP fixture. Real deployments must use HTTPS and Secure cookies.
      SESSION_COOKIE_SECURE: "false"
      APP_CORS_ALLOWED_ORIGINS: ${POSTMAN_ALLOWED_ORIGINS-http://localhost:5173}
      APP_LOGIN_THROTTLE_ACCOUNT_LIMIT: ${POSTMAN_LOGIN_ACCOUNT_LIMIT:-5}
      APP_LOGIN_THROTTLE_IP_LIMIT: ${POSTMAN_LOGIN_IP_LIMIT:-100}
      APP_LOGIN_THROTTLE_WINDOW_SECONDS: ${POSTMAN_LOGIN_WINDOW_SECONDS:-900}
      APP_LOGIN_THROTTLE_BLOCK_SECONDS: ${POSTMAN_LOGIN_BLOCK_SECONDS:-900}
      APP_LOGIN_TRUSTED_PROXIES: ${POSTMAN_LOGIN_TRUSTED_PROXIES:-}
      APP_AGE_GROUP_BANDS: ${POSTMAN_AGE_GROUP_BANDS:-}
      APP_ACTIVATION_URL: ${POSTMAN_ACTIVATION_URL:-http://localhost:18080/activate}
      APP_MAIL_OUTBOX_KEY: ${POSTMAN_MAIL_OUTBOX_KEY:?Set POSTMAN_MAIL_OUTBOX_KEY in a private env file; retain it across backend restarts}
      APP_MAIL_OUTBOX_POLL_MS: ${POSTMAN_MAIL_OUTBOX_POLL_MS:-1000}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@flyingangels.local
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "127.0.0.1:${POSTMAN_MAILPIT_PORT:-18025}:8025"
