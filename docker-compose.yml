services:
  frontend:
    build:
      context: ./frontend
      dockerfile: DockerFile
    container_name: flying-angels-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - application

  mysql:
    image: mysql:8.4
    container_name: flying-angels-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flying_angels}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - database

  backend:
    build:
      context: ./backend
      dockerfile: DockerFile
    container_name: flying-angels-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-flying_angels}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:?Set APP_ADMIN_EMAIL in .env}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
      SPRING_FLYWAY_BASELINE_VERSION: ${SPRING_FLYWAY_BASELINE_VERSION:-1}
      SPRING_FLYWAY_TARGET: ${SPRING_FLYWAY_TARGET:-latest}
      APP_LOGIN_THROTTLE_ENABLED: ${APP_LOGIN_THROTTLE_ENABLED:-true}
      APP_LOGIN_THROTTLE_ACCOUNT_LIMIT: ${APP_LOGIN_THROTTLE_ACCOUNT_LIMIT:-5}
      APP_LOGIN_THROTTLE_IP_LIMIT: ${APP_LOGIN_THROTTLE_IP_LIMIT:-100}
      APP_LOGIN_THROTTLE_WINDOW_SECONDS: ${APP_LOGIN_THROTTLE_WINDOW_SECONDS:-900}
      APP_LOGIN_THROTTLE_BLOCK_SECONDS: ${APP_LOGIN_THROTTLE_BLOCK_SECONDS:-900}
      APP_LOGIN_TRUSTED_PROXIES: ${APP_LOGIN_TRUSTED_PROXIES:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@flyingangels.local}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      APP_ACTIVATION_URL: ${APP_ACTIVATION_URL:-http://localhost:5173/activate}
      APP_INVITATION_HOURS: ${APP_INVITATION_HOURS:-48}
      APP_MAIL_OUTBOX_KEY: ${APP_MAIL_OUTBOX_KEY:-}
      APP_MAIL_OUTBOX_ENABLED: ${APP_MAIL_OUTBOX_ENABLED:-true}
      APP_MAIL_OUTBOX_POLL_MS: ${APP_MAIL_OUTBOX_POLL_MS:-5000}
      APP_MAIL_OUTBOX_BATCH_SIZE: ${APP_MAIL_OUTBOX_BATCH_SIZE:-20}
      APP_MAIL_OUTBOX_MAX_ATTEMPTS: ${APP_MAIL_OUTBOX_MAX_ATTEMPTS:-5}
      APP_MAIL_OUTBOX_RETRY_BASE_SECONDS: ${APP_MAIL_OUTBOX_RETRY_BASE_SECONDS:-60}
      APP_MAIL_OUTBOX_RETRY_MAX_SECONDS: ${APP_MAIL_OUTBOX_RETRY_MAX_SECONDS:-3600}
      APP_MAIL_OUTBOX_LEASE_SECONDS: ${APP_MAIL_OUTBOX_LEASE_SECONDS:-120}
      APP_AVAILABILITY_TIME_ZONE: ${APP_AVAILABILITY_TIME_ZONE:-America/Toronto}
      APP_AGE_GROUP_BANDS: ${APP_AGE_GROUP_BANDS:-}
    ports:
      - "127.0.0.1:${BACKEND_HTTP_PORT:-8080}:8080"
    networks:
      - application
      - database

  mailpit:
    image: axllent/mailpit:v1.31.5
    profiles: ["mail"]
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - application

volumes:
  mysql_data:

networks:
  application:
    driver: bridge
  database:
    driver: bridge
