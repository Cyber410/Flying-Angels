services:
  frontend:
    build:
      context: ./frontend
      dockerfile: DockerFile
    container_name: flying-angels-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - frontend-net

  mysql:
    image: mysql:8.4
    container_name: flying-angels-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: flying_angels
      MYSQL_USER: appuser
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_root_password
      - db_password
    # ports:
    #   - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$(cat /run/secrets/db_root_password)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  backend:
    build:
      context: ./backend
      dockerfile: DockerFile
    container_name: flying-angels-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/flying_angels?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
    secrets:
      - source: db_password
        target: spring.datasource.password
    ports:
      - "8080:8080"
    networks:
      - frontend-net
      - backend-net

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_password:
    file: ./secrets/db_password.txt

volumes:
  mysql_data: