<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1350" viewBox="0 0 1900 1350" role="img">
  <title>Role-Based Authentication &amp; Access Control — code design</title>
  <desc>Actors: Admin / Coach / Athlete or Parent with a profile link. E means existing; P means proposed. SUNNY: validate credentials -&gt; authenticate -&gt; role-filtered navigation -&gt; authorized action -&gt; logout. RAINY: missing fields stay local; wrong credentials use a generic error; expired sessions return 401; forbidden actions return 403. POLICY: Admin owns staff, links, basic athlete and meet edits. Coach manages events, assignments, results, imports, exports and availability. DESIGN NOTE: replace current Basic policy; Coach import field ownership remains a decision to resolve (policy pending).</desc>
  <rect width="1900" height="1350" fill="#ffffff" />
  <rect x="32" y="24" width="1836" height="86" rx="8" fill="#17263f" stroke="#17263f" />
  <text x="52" y="61" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Role-Based Authentication &amp; Access Control</text>
  <text x="52" y="91" fill="#dae5f7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Code design  /  Admin / Coach / Athlete or Parent with a profile link</text>
  <rect x="32" y="120" width="1836" height="38" rx="8" fill="#ffffff" stroke="#ffffff" />
  <text x="44" y="146" fill="#53617b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">E = existing source   |   P = proposed component/contract   |   EXTEND = existing layer + planned changes   |   dashed arrow = response mapping</text>
  <rect x="32" y="176" width="450" height="295" rx="8" fill="#f7f9fc" stroke="#dce2ec" />
  <text x="48" y="204" fill="#53617b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">FRONTEND  /  REACT + TYPESCRIPT</text>
  <rect x="514" y="176" width="820" height="295" rx="8" fill="#f7f9fc" stroke="#dce2ec" />
  <text x="530" y="204" fill="#53617b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">HTTP API  /  TARGET CONTRACT</text>
  <rect x="32" y="510" width="1302" height="625" rx="8" fill="#f7f9fc" stroke="#dce2ec" />
  <text x="48" y="538" fill="#53617b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">BACKEND  /  SPRING BOOT + JPA</text>
  <rect x="1366" y="510" width="502" height="625" rx="8" fill="#f7f9fc" stroke="#dce2ec" />
  <text x="1382" y="538" fill="#53617b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">DATA MODEL  /  MYSQL</text>
  <rect x="1366" y="176" width="502" height="295" rx="8" fill="#f7f9fc" stroke="#dce2ec" />
  <text x="1382" y="204" fill="#53617b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">STATUS  /  DESIGN SCOPE</text>
  <rect x="1382" y="222" width="470" height="232" rx="8" fill="#ffffff" stroke="#c7d0df" />
  <text x="1400" y="252" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Sprint 3 target design</text>
  <text x="1400" y="278" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Checked against repository source.</text>
  <text x="1400" y="304" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Purple: proposed layer.</text>
  <text x="1400" y="330" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Amber: extend existing code.</text>
  <text x="1400" y="356" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Green: reusable existing model.</text>
  <text x="1400" y="382" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Routes and new class names are proposed.</text>
  <text x="1400" y="408" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">E: existing code. P: proposed Sprint 3 work.</text>
  <rect x="48" y="222" width="418" height="232" rx="8" fill="#f3f0ff" stroke="#7050a3" />
  <text x="66" y="248" fill="#7050a3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">FRONTEND  /  PROPOSED</text>
  <text x="66" y="277" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">LoginPage / UserManagementPage</text>
  <text x="66" y="305" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Login, account menu and logout</text>
  <text x="66" y="326" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] ProtectedRoute + permission-aware</text>
  <text x="66" y="347" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">navigation</text>
  <text x="66" y="368" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Staff editor; denied / expired-link</text>
  <text x="66" y="389" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">screens</text>
  <rect x="530" y="222" width="788" height="232" rx="8" fill="#f3f0ff" stroke="#7050a3" />
  <text x="548" y="248" fill="#7050a3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">HTTP API  /  PROPOSED</text>
  <text x="548" y="277" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Session, staff and athlete-link routes</text>
  <text x="548" y="305" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] GET /api/auth/csrf | POST /api/auth/login, /logout | GET /api/auth/me</text>
  <text x="548" y="326" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] GET, POST /api/users | PATCH /api/users/{id}</text>
  <text x="548" y="347" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] POST /api/athletes/{id}/access-links | DELETE /api/access-links/{id}</text>
  <text x="548" y="368" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] POST /api/portal/session | GET /api/portal/profile</text>
  <rect x="48" y="558" width="556" height="250" rx="8" fill="#f3f0ff" stroke="#7050a3" />
  <text x="66" y="584" fill="#7050a3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">CONTROLLER / SECURITY BOUNDARY  /  PROPOSED</text>
  <text x="66" y="613" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">AuthController / UserController</text>
  <text x="66" y="641" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] AthleteAccessController + PortalSessionController</text>
  <text x="66" y="662" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[E] SecurityConfig -&gt; [P] session and endpoint policy</text>
  <text x="66" y="683" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Require active staff account or scoped link principal</text>
  <rect x="636" y="558" width="682" height="250" rx="8" fill="#f3f0ff" stroke="#7050a3" />
  <text x="654" y="584" fill="#7050a3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">SERVICE  /  PROPOSED</text>
  <text x="654" y="613" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">StaffAuthentication / AthleteAccessService</text>
  <text x="654" y="641" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] UserDetailsService + PasswordEncoder</text>
  <text x="654" y="662" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Password check; rotate session ID at login</text>
  <text x="654" y="683" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Logout / deactivation invalidates staff sessions</text>
  <text x="654" y="704" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Random link secret; store hash, expiry and revocation</text>
  <text x="654" y="725" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Check scoped token state on every portal request</text>
  <rect x="636" y="850" width="682" height="267" rx="8" fill="#f3f0ff" stroke="#7050a3" />
  <text x="654" y="876" fill="#7050a3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">REPOSITORY  /  PROPOSED</text>
  <text x="654" y="905" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">UserRepository / AthleteAccessTokenRepository</text>
  <text x="654" y="933" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] findByEmailIgnoreCase(); active-account lookup</text>
  <text x="654" y="954" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] findByTokenHash(); expiry / revocation checks</text>
  <text x="654" y="975" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[E] AthleteRepository verifies target profile exists</text>
  <text x="654" y="996" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] SessionRegistry invalidates disabled users' sessions</text>
  <rect x="1382" y="558" width="470" height="559" rx="8" fill="#f3f0ff" stroke="#7050a3" />
  <text x="1400" y="584" fill="#7050a3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">ENTITY / DATABASE  /  PROPOSED</text>
  <text x="1400" y="613" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">User / AthleteAccessToken</text>
  <text x="1400" y="641" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] users: unique email, passwordHash, role,</text>
  <text x="1400" y="662" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">active</text>
  <text x="1400" y="683" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] roles: ADMIN or COACH; never ATHLETE staff</text>
  <text x="1400" y="704" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">role</text>
  <text x="1400" y="725" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] athlete_access_tokens: athleteId, tokenHash,</text>
  <text x="1400" y="746" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">expiresAt, revokedAt, createdBy</text>
  <text x="1400" y="767" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Portal session retains scoped token reference</text>
  <text x="1400" y="788" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Staff HTTP session lifecycle managed by Spring</text>
  <text x="1400" y="809" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[E] Athlete remains the profile identity</text>
  <rect x="48" y="850" width="556" height="267" rx="8" fill="#f3f0ff" stroke="#7050a3" />
  <text x="66" y="876" fill="#7050a3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">RESPONSE / UI STATE  /  PROPOSED</text>
  <text x="66" y="905" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">AuthSessionResponse / PortalPrincipal</text>
  <text x="66" y="933" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Staff: user ID, display name, role, permissions</text>
  <text x="66" y="954" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Portal: one athlete scope; no staff permissions</text>
  <text x="66" y="975" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">401 -&gt; sign in; 403 -&gt; Access Denied</text>
  <text x="66" y="996" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Invalid / expired / revoked link -&gt; access unavailable</text>
  <polyline points="466,338 530,338" fill="none" stroke="#53617b" stroke-width="1.8" />
  <path d="M521.0,334.0 L530,338 L521.0,342.0" fill="none" stroke="#53617b" stroke-width="1.8" />
  <polyline points="924,454 924,490 326,490 326,558" fill="none" stroke="#53617b" stroke-width="1.8" />
  <path d="M330.0,549.0 L326,558 L322.0,549.0" fill="none" stroke="#53617b" stroke-width="1.8" />
  <polyline points="604,683 636,683" fill="none" stroke="#53617b" stroke-width="1.8" />
  <path d="M627.0,679.0 L636,683 L627.0,687.0" fill="none" stroke="#53617b" stroke-width="1.8" />
  <polyline points="977,808 977,850" fill="none" stroke="#53617b" stroke-width="1.8" />
  <path d="M981.0,841.0 L977,850 L973.0,841.0" fill="none" stroke="#53617b" stroke-width="1.8" />
  <polyline points="1318,983 1350,983 1350,837 1382,837" fill="none" stroke="#53617b" stroke-width="1.8" />
  <path d="M1373.0,833.0 L1382,837 L1373.0,841.0" fill="none" stroke="#53617b" stroke-width="1.8" />
  <polyline points="326,808 326,850" fill="none" stroke="#53617b" stroke-width="1.8" stroke-dasharray="7 5" />
  <path d="M330.0,841.0 L326,850 L322.0,841.0" fill="none" stroke="#53617b" stroke-width="1.8" />
  <rect x="32" y="1170" width="1836" height="156" rx="8" fill="#f7f9fc" stroke="#dce2ec" />
  <text x="48" y="1198" fill="#53617b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">BEHAVIOR  /  SUNNY-DAY, RAINY-DAY AND DESIGN NOTES</text>
  <rect x="44" y="1208" width="1810" height="106" rx="8" fill="#f7f9fc" stroke="#f7f9fc" />
  <text x="50" y="1227" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">SUNNY: validate credentials -&gt; authenticate -&gt; role-filtered navigation -&gt; authorized action -&gt; logout.</text>
  <text x="50" y="1247" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">RAINY: missing fields stay local; wrong credentials use a generic error; expired sessions return 401; forbidden actions return 403.</text>
  <text x="50" y="1267" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">POLICY: Admin owns staff, links, basic athlete and meet edits. Coach manages events, assignments, results, imports, exports and availability.</text>
  <text x="50" y="1287" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">DESIGN NOTE: replace current Basic policy; Coach import field ownership remains a decision to resolve (policy pending).</text>
</svg>