<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1350" viewBox="0 0 1900 1350" role="img">
  <title>Centralized Rankings — code design</title>
  <desc>Actors: Admin / Coach / Athlete or Parent with restricted ranking access. E means existing; P means proposed. SUNNY: select event + age + gender -&gt; best result per athlete -&gt; sorted shared ranks -&gt; authorized performance details. RAINY: no valid event results or no filter matches -&gt; empty state; tied scores keep equal rank; other profiles stay restricted. REUSE: existing per-event leaderboard is not a centralized ranking endpoint; ranking must not take best results from one paged attempt list. DESIGN NOTE: ageAsOf, competition-only eligibility, 1/1/3 ties and parent-visible ranking fields are proposed policies (policy pending).</desc>
  <rect width="1900" height="1350" fill="#ffffff" />
  <rect x="32" y="24" width="1836" height="86" rx="8" fill="#17263f" stroke="#17263f" />
  <text x="52" y="61" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Centralized Rankings</text>
  <text x="52" y="91" fill="#dae5f7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Code design  /  Admin / Coach / Athlete or Parent with restricted ranking access</text>
  <rect x="32" y="120" width="1836" height="38" rx="8" fill="#ffffff" stroke="#ffffff" />
  <text x="44" y="146" fill="#53617b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">E = existing source   |   P = proposed component/contract   |   EXTEND = existing layer + planned changes   |   dashed arrow = response mapping</text>
  <rect x="32" y="176" width="450" height="295" rx="8" fill="#f7f9fc" stroke="#dce2ec" />
  <text x="48" y="204" fill="#53617b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">FRONTEND  /  REACT + TYPESCRIPT</text>
  <rect x="514" y="176" width="820" height="295" rx="8" fill="#f7f9fc" stroke="#dce2ec" />
  <text x="530" y="204" fill="#53617b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">HTTP API  /  TARGET CONTRACT</text>
  <rect x="32" y="510" width="1302" height="625" rx="8" fill="#f7f9fc" stroke="#dce2ec" />
  <text x="48" y="538" fill="#53617b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">BACKEND  /  SPRING BOOT + JPA</text>
  <rect x="1366" y="510" width="502" height="625" rx="8" fill="#f7f9fc" stroke="#dce2ec" />
  <text x="1382" y="538" fill="#53617b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">DATA MODEL  /  MYSQL</text>
  <rect x="1366" y="176" width="502" height="295" rx="8" fill="#f7f9fc" stroke="#dce2ec" />
  <text x="1382" y="204" fill="#53617b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">STATUS  /  DESIGN SCOPE</text>
  <rect x="1382" y="222" width="470" height="232" rx="8" fill="#ffffff" stroke="#c7d0df" />
  <text x="1400" y="252" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Sprint 3 target design</text>
  <text x="1400" y="278" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Checked against repository source.</text>
  <text x="1400" y="304" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Purple: proposed layer.</text>
  <text x="1400" y="330" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Amber: extend existing code.</text>
  <text x="1400" y="356" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Green: reusable existing model.</text>
  <text x="1400" y="382" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Routes and new class names are proposed.</text>
  <text x="1400" y="408" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">E: existing code. P: proposed Sprint 3 work.</text>
  <rect x="48" y="222" width="418" height="232" rx="8" fill="#f3f0ff" stroke="#7050a3" />
  <text x="66" y="248" fill="#7050a3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">FRONTEND  /  PROPOSED</text>
  <text x="66" y="277" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">RankingsPage / RankingFilters</text>
  <text x="66" y="305" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Event definition, age group and gender</text>
  <text x="66" y="326" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">filters</text>
  <text x="66" y="347" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Shared positions; clear / change filters</text>
  <text x="66" y="368" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Permission-checked profile navigation</text>
  <rect x="530" y="222" width="788" height="232" rx="8" fill="#f3f0ff" stroke="#7050a3" />
  <text x="548" y="248" fill="#7050a3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">HTTP API  /  PROPOSED</text>
  <text x="548" y="277" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Rankings and restricted portal ranking routes</text>
  <text x="548" y="305" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] GET /api/rankings?categoryId=...&amp;gender=...&amp;minAge=...&amp;maxAge=...&amp;ageAsOf=...</text>
  <text x="548" y="326" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] GET /api/portal/rankings?... -&gt; approved minimal fields only</text>
  <text x="548" y="347" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[E] GET /api/events/{id}/leaderboard is event-instance only</text>
  <text x="548" y="368" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] New service aggregates across meets before ranking / paging</text>
  <rect x="48" y="558" width="556" height="250" rx="8" fill="#f3f0ff" stroke="#7050a3" />
  <text x="66" y="584" fill="#7050a3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">CONTROLLER / AUTHORIZATION  /  PROPOSED</text>
  <text x="66" y="613" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">RankingsController / PortalRankingsController</text>
  <text x="66" y="641" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Validate category and age reference / bounds</text>
  <text x="66" y="662" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] ADMIN / COACH can open authorized profiles</text>
  <text x="66" y="683" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] PortalAccessPolicy restricts output and drill-down</text>
  <text x="66" y="704" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Shared RankingQuery; different response projections</text>
  <rect x="636" y="558" width="682" height="250" rx="8" fill="#f3f0ff" stroke="#7050a3" />
  <text x="654" y="584" fill="#7050a3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">SERVICE  /  PROPOSED</text>
  <text x="654" y="613" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">RankingsService / PerformanceSummaryService</text>
  <text x="654" y="641" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Filter comparable linked competition results</text>
  <text x="654" y="662" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] One best VALID non-null score per athlete/category</text>
  <text x="654" y="683" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] ASC: smaller first; DESC: larger first</text>
  <text x="654" y="704" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Equal scores share position (proposed: 1, 1, 3)</text>
  <text x="654" y="725" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Apply age at explicit ageAsOf; paginate ranked set</text>
  <rect x="636" y="850" width="682" height="267" rx="8" fill="#fff8e8" stroke="#966719" />
  <text x="654" y="876" fill="#966719" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">REPOSITORY  /  EXTEND</text>
  <text x="654" y="905" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">EventResultRepository / RankingQueryRepository</text>
  <text x="654" y="933" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[E] Central results, athlete DOB and category metadata</text>
  <text x="654" y="954" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Query valid attempts with event/category joins</text>
  <text x="654" y="975" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Filter and aggregate complete set before paging</text>
  <text x="654" y="996" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[E] Existing leaderboard / overview are reuse references</text>
  <rect x="1382" y="558" width="470" height="559" rx="8" fill="#eff8f3" stroke="#277451" />
  <text x="1400" y="584" fill="#277451" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">ENTITY / DATABASE  /  EXISTING</text>
  <text x="1400" y="613" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">EventResult + Athlete + EventCategory</text>
  <text x="1400" y="641" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[E] EventResult links athlete, category and meet</text>
  <text x="1400" y="662" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">event</text>
  <text x="1400" y="683" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[E] score + status + unit support valid comparison</text>
  <text x="1400" y="704" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[E] Athlete.dateOfBirth + gender support filters</text>
  <text x="1400" y="725" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[E] EventCategory identifies discipline across</text>
  <text x="1400" y="746" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">meets</text>
  <text x="1400" y="767" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[E] Category unit + rankingOrder determine</text>
  <text x="1400" y="788" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">comparison</text>
  <text x="1400" y="809" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">No persisted rank or duplicate performance table</text>
  <text x="1400" y="830" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Proposed ranking values are derived at query time</text>
  <rect x="48" y="850" width="556" height="267" rx="8" fill="#f3f0ff" stroke="#7050a3" />
  <text x="66" y="876" fill="#7050a3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">RESPONSE / UI STATE  /  PROPOSED</text>
  <text x="66" y="905" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">RankingResponse / PortalRankingResponse</text>
  <text x="66" y="933" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] position, name, best mark, unit and context</text>
  <text x="66" y="954" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] Portal: approved public fields; no private notes/DOB</text>
  <text x="66" y="975" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">[P] profileAccessible flag; server rechecks every link</text>
  <text x="66" y="996" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">No event results / no matching filters -&gt; empty state</text>
  <text x="66" y="1017" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Ties keep shared positions across pagination</text>
  <polyline points="466,338 530,338" fill="none" stroke="#53617b" stroke-width="1.8" />
  <path d="M521.0,334.0 L530,338 L521.0,342.0" fill="none" stroke="#53617b" stroke-width="1.8" />
  <polyline points="924,454 924,490 326,490 326,558" fill="none" stroke="#53617b" stroke-width="1.8" />
  <path d="M330.0,549.0 L326,558 L322.0,549.0" fill="none" stroke="#53617b" stroke-width="1.8" />
  <polyline points="604,683 636,683" fill="none" stroke="#53617b" stroke-width="1.8" />
  <path d="M627.0,679.0 L636,683 L627.0,687.0" fill="none" stroke="#53617b" stroke-width="1.8" />
  <polyline points="977,808 977,850" fill="none" stroke="#53617b" stroke-width="1.8" />
  <path d="M981.0,841.0 L977,850 L973.0,841.0" fill="none" stroke="#53617b" stroke-width="1.8" />
  <polyline points="1318,983 1350,983 1350,837 1382,837" fill="none" stroke="#53617b" stroke-width="1.8" />
  <path d="M1373.0,833.0 L1382,837 L1373.0,841.0" fill="none" stroke="#53617b" stroke-width="1.8" />
  <polyline points="326,808 326,850" fill="none" stroke="#53617b" stroke-width="1.8" stroke-dasharray="7 5" />
  <path d="M330.0,841.0 L326,850 L322.0,841.0" fill="none" stroke="#53617b" stroke-width="1.8" />
  <rect x="32" y="1170" width="1836" height="156" rx="8" fill="#f7f9fc" stroke="#dce2ec" />
  <text x="48" y="1198" fill="#53617b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">BEHAVIOR  /  SUNNY-DAY, RAINY-DAY AND DESIGN NOTES</text>
  <rect x="44" y="1208" width="1810" height="106" rx="8" fill="#f7f9fc" stroke="#f7f9fc" />
  <text x="50" y="1227" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">SUNNY: select event + age + gender -&gt; best result per athlete -&gt; sorted shared ranks -&gt; authorized performance details.</text>
  <text x="50" y="1247" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">RAINY: no valid event results or no filter matches -&gt; empty state; tied scores keep equal rank; other profiles stay restricted.</text>
  <text x="50" y="1267" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">REUSE: existing per-event leaderboard is not a centralized ranking endpoint; ranking must not take best results from one paged attempt list.</text>
  <text x="50" y="1287" fill="#26334a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">DESIGN NOTE: ageAsOf, competition-only eligibility, 1/1/3 ties and parent-visible ranking fields are proposed policies (policy pending).</text>
</svg>